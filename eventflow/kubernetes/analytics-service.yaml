apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: eventflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
        - name: analytics-service
          image: eventflow/analytics-service:latest
          ports:
            - containerPort: 8003
          env:
            - name: SERVICE_NAME
              value: analytics-service
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: eventflow-secrets
                  key: database-url
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: eventflow
spec:
  selector:
    app: analytics-service
  ports:
    - port: 80
      targetPort: 8003
