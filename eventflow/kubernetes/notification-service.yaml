apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: eventflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: eventflow/notification-service:latest
          ports:
            - containerPort: 8002
          env:
            - name: SERVICE_NAME
              value: notification-service
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: eventflow-secrets
                  key: database-url
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: eventflow
spec:
  selector:
    app: notification-service
  ports:
    - port: 80
      targetPort: 8002
