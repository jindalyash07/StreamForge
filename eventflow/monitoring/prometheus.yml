global:
  scrape_interval: 15s

scrape_configs:
  - job_name: eventflow-order-service
    metrics_path: /metrics
    static_configs:
      - targets: ["order_service:8000"]
  - job_name: eventflow-payment-service
    metrics_path: /metrics
    static_configs:
      - targets: ["payment_service:8001"]
  - job_name: eventflow-notification-service
    metrics_path: /metrics
    static_configs:
      - targets: ["notification_service:8002"]
  - job_name: eventflow-analytics-service
    metrics_path: /metrics
    static_configs:
      - targets: ["analytics_service:8003"]
